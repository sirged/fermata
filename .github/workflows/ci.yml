name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: server
        run: pip install -e ".[dev]"
      # An extracted transcription is stored to be rendered, so the tests
      # check it parses with the real alphaTab importer the player uses -
      # which is a runtime dependency of the web project. Installing it here
      # (runtime only: this needs the importer, not playwright) is what makes
      # that check run instead of skip.
      - name: Install alphaTab
        working-directory: web
        run: npm ci --omit=dev
      # Extraction is exercised against the engraved fixtures committed under
      # server/tests/fixtures/engraved. The tests that need the maintainer's
      # own sheet music read it from FERMATA_TEST_LIBRARY and skip when it is
      # unset - the run prints how many did, so a green log cannot be
      # mistaken for a complete one.
      - name: Test
        working-directory: server
        run: python -m pytest -q -rs

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # The build also asserts the renderer's font and soundfont were copied,
      # which a plain compile would not catch.
      - name: Build
        working-directory: web
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # Well above the ~75s this takes, and below the six-hour default a hung
    # browser would otherwise sit burning.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # This suite drives the real backend serving the real build, because a
      # passing build proves nothing about whether anything rendered - so both
      # halves are installed here. Playwright starts the server itself; see
      # web/playwright.config.js.
      - name: Install server
        working-directory: server
        run: pip install -e .
      - name: Install web
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: web
        run: npm run test:browser
      - name: Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t fermata:ci .
