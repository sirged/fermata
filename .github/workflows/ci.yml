name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    # Measured on main: pytest itself is 0.8-1.3 minutes, and the whole job
    # has run anywhere from 1.7 minutes (33887700373) to 8.7 minutes
    # (33854927005). The entire spread is one step - `npm ci --omit=dev`,
    # which reported "added 6 packages in 7m" on run 33845939449 against 0.0
    # minutes on a good run. That is the same registry stall the browser job
    # had; the cache below is the fix for it, and this is only the floor
    # under it, so a stall that outlives the cache fails in minutes instead
    # of holding a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Its OWN key, deliberately not the browser job's. This job installs
      # with --omit=dev, so the tree it saves has no playwright and none of
      # the build tooling in it. Sharing a key would mean whichever job ran
      # first decided what the other one restored - and a browser job that
      # restored this tree would skip its own `npm ci` and then have no
      # playwright to run the suite with. The "omit-dev" segment is what
      # keeps the two from ever colliding; the lockfile hash and the Node
      # major are there for the same reason as in that job, so any
      # dependency or runtime change invalidates the entry.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-omit-dev-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json') }}
      # [mcp] as well as [dev]: server/tests/test_mcp_server.py connects a
      # real protocol client to a real listener, and without the extra those
      # tests would skip - green, and proving nothing about the feature.
      - name: Install
        working-directory: server
        run: pip install -e ".[dev,mcp]"
      # An extracted transcription is stored to be rendered, so the tests
      # check it parses with the real alphaTab importer the player uses -
      # which is a runtime dependency of the web project. Installing it here
      # (runtime only: this needs the importer, not playwright) is what makes
      # that check run instead of skip.
      - name: Install alphaTab
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci --omit=dev
      # The emitted MusicXML is validated against the REAL MusicXML 4.0 schema,
      # which is what catches a child in the wrong place - the profile's
      # xs:sequence elements have exactly one legal order and anything else
      # fails validation outright. The schema cannot live in the repository, so
      # the two tests that use it read its path from FERMATA_MUSICXML_XSD and
      # skip without it, and for a long time that meant they only ever ran on a
      # maintainer's machine. Fetched here instead, from the tagged release, so
      # they run on every change: the schema's own xs:import elements name
      # remote URLs for xml.xsd and xlink.xsd, which is why the two are
      # downloaded alongside it and the schemaLocation attributes repointed - a
      # validator would otherwise fail with an unrelated complaint about
      # xml:lang. The step fails loudly rather than silently degrading to a skip.
      - name: Fetch the MusicXML schema
        run: |
          mkdir -p "$RUNNER_TEMP/musicxml-schema"
          cd "$RUNNER_TEMP/musicxml-schema"
          base=https://raw.githubusercontent.com/w3c/musicxml/v4.0/schema
          for f in musicxml.xsd xml.xsd xlink.xsd; do
            curl -fsSL --retry 3 --retry-all-errors -o "$f" "$base/$f"
          done
          sed -i 's|http://www.musicxml.org/xsd/xml.xsd|xml.xsd|;
                  s|http://www.musicxml.org/xsd/xlink.xsd|xlink.xsd|' musicxml.xsd
          echo "FERMATA_MUSICXML_XSD=$RUNNER_TEMP/musicxml-schema/musicxml.xsd" >> "$GITHUB_ENV"
      # Extraction is exercised against the engraved fixtures committed under
      # server/tests/fixtures/engraved. The tests that need the maintainer's
      # own sheet music read it from FERMATA_TEST_LIBRARY and skip when it is
      # unset - the run prints how many did, so a green log cannot be
      # mistaken for a complete one.
      - name: Test
        working-directory: server
        run: python -m pytest -q -rs

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # The build also asserts the renderer's font and soundfont were copied,
      # which a plain compile would not catch.
      - name: Build
        working-directory: web
        run: npm run build
      # A regression check on the RUNNER, not on the product: --list starts
      # no browser and no server and finishes in well under a second, which
      # is why it can live in this job rather than the browser one. It needs
      # only web/node_modules (installed above) and web/dist (built above -
      # playwright.config.js refuses to load without it).
      #
      # What it guards: run-browser-tests.mjs used to hand its argv to a
      # shell, and on Windows a shell joins argv into a single command line
      # whose quoting does not cover internal spaces. A multi-word --grep
      # came out the far side as separate bare words, so Playwright saw only
      # the first one and ran a wider set than the caller asked for -
      # silently, with a green run to show for it. Six tests in this file
      # have "gig mode" in their title and seven have "gig", so a --grep that
      # loses its second word lists seven and this step goes red. Proven
      # against that exact revert before it was added.
      #
      # PLAYWRIGHT_ALLOW_PARTIAL because --list executes nothing at all: every
      # spec file reports zero tests run, which the runner's spec-floor guard
      # would otherwise, and correctly, read as the whole suite going missing.
      - name: Check the runner passes a multi-word --grep through
        working-directory: web
        env:
          PLAYWRIGHT_ALLOW_PARTIAL: "1"
        run: |
          listed=$(node scripts/run-browser-tests.mjs \
            tests/browser/practice-shortcuts.spec.js --grep "gig mode" --list)
          echo "$listed"
          echo "$listed" | grep -qx "Total: 6 tests in 1 file"

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # The suite itself takes about 7.6 minutes; 25 covers that plus a
    # worst-observed 7.7-minute setup, with headroom. The caching below is
    # the fix for that setup variance - this is only the floor under it, not
    # a substitute for it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # setup-node's cache above only persists npm's download cache, which
      # still leaves `npm ci` making per-package registry calls whose
      # latency varies run to run. Caching the installed tree itself, keyed
      # on the lockfile so any dependency change invalidates it, lets a hit
      # skip the network entirely and land on PR branches the same as main
      # pushes.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('web/package-lock.json') }}
      # This suite drives the real backend serving the real build, because a
      # passing build proves nothing about whether anything rendered - so both
      # halves are installed here. Playwright starts the server itself; see
      # web/playwright.config.js.
      - name: Install server
        working-directory: server
        run: pip install -e .
      - name: Install web
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      # Keyed on Playwright's own version rather than the whole lockfile, so
      # a change to an unrelated dependency doesn't force a re-download of
      # the browser binaries this cache exists to avoid.
      - name: Read Playwright version
        id: playwright-version
        working-directory: web
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # --with-deps installs OS packages (fonts, libgtk, ...) that live
      # outside the cached path above, so this always has to run - a browser
      # cache hit only skips the binary download inside it, not this step.
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: web
        run: npm run test:browser
      - name: Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build args passed here so this job exercises the same path a real
      # build would - GET /api/version reporting an actual commit and date
      # rather than the "dev" fallback every other test run sees.
      - name: Build
        run: |
          docker build \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%d) \
            -t fermata:ci .
