name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: server
        run: pip install -e ".[dev]"
      # An extracted transcription is stored to be rendered, so the tests
      # check it parses with the real alphaTab importer the player uses -
      # which is a runtime dependency of the web project. Installing it here
      # (runtime only: this needs the importer, not playwright) is what makes
      # that check run instead of skip.
      - name: Install alphaTab
        working-directory: web
        run: npm ci --omit=dev
      # The emitted MusicXML is validated against the REAL MusicXML 4.0 schema,
      # which is what catches a child in the wrong place - the profile's
      # xs:sequence elements have exactly one legal order and anything else
      # fails validation outright. The schema cannot live in the repository, so
      # the two tests that use it read its path from FERMATA_MUSICXML_XSD and
      # skip without it, and for a long time that meant they only ever ran on a
      # maintainer's machine. Fetched here instead, from the tagged release, so
      # they run on every change: the schema's own xs:import elements name
      # remote URLs for xml.xsd and xlink.xsd, which is why the two are
      # downloaded alongside it and the schemaLocation attributes repointed - a
      # validator would otherwise fail with an unrelated complaint about
      # xml:lang. The step fails loudly rather than silently degrading to a skip.
      - name: Fetch the MusicXML schema
        run: |
          mkdir -p "$RUNNER_TEMP/musicxml-schema"
          cd "$RUNNER_TEMP/musicxml-schema"
          base=https://raw.githubusercontent.com/w3c/musicxml/v4.0/schema
          for f in musicxml.xsd xml.xsd xlink.xsd; do
            curl -fsSL --retry 3 --retry-all-errors -o "$f" "$base/$f"
          done
          sed -i 's|http://www.musicxml.org/xsd/xml.xsd|xml.xsd|;
                  s|http://www.musicxml.org/xsd/xlink.xsd|xlink.xsd|' musicxml.xsd
          echo "FERMATA_MUSICXML_XSD=$RUNNER_TEMP/musicxml-schema/musicxml.xsd" >> "$GITHUB_ENV"
      # Extraction is exercised against the engraved fixtures committed under
      # server/tests/fixtures/engraved. The tests that need the maintainer's
      # own sheet music read it from FERMATA_TEST_LIBRARY and skip when it is
      # unset - the run prints how many did, so a green log cannot be
      # mistaken for a complete one.
      - name: Test
        working-directory: server
        run: python -m pytest -q -rs

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # The build also asserts the renderer's font and soundfont were copied,
      # which a plain compile would not catch.
      - name: Build
        working-directory: web
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # The suite itself runs in ~75s. 25 is a floor under setup-time variance
    # (npm's registry fetches are not equally fast on every run), not the
    # fix for it - the caching below is the fix; this just keeps a slow
    # network from turning a passing suite into a cancelled job.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # setup-node's cache above only persists npm's download cache, which
      # still leaves `npm ci` making per-package registry calls whose
      # latency varies run to run. Caching the installed tree itself, keyed
      # on the lockfile so any dependency change invalidates it, lets a hit
      # skip the network entirely and land on PR branches the same as main
      # pushes.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # This suite drives the real backend serving the real build, because a
      # passing build proves nothing about whether anything rendered - so both
      # halves are installed here. Playwright starts the server itself; see
      # web/playwright.config.js.
      - name: Install server
        working-directory: server
        run: pip install -e .
      - name: Install web
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      # Keyed on Playwright's own version rather than the whole lockfile, so
      # a change to an unrelated dependency doesn't force a re-download of
      # the browser binaries this cache exists to avoid.
      - name: Read Playwright version
        id: playwright-version
        working-directory: web
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # --with-deps installs OS packages (fonts, libgtk, ...) that live
      # outside the cached path above, so this always has to run - a browser
      # cache hit only skips the binary download inside it, not this step.
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test
        working-directory: web
        run: npm run test:browser
      - name: Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build args passed here so this job exercises the same path a real
      # build would - GET /api/version reporting an actual commit and date
      # rather than the "dev" fallback every other test run sees.
      - name: Build
        run: |
          docker build \
            --build-arg BUILD_COMMIT=$(git rev-parse --short HEAD) \
            --build-arg BUILD_DATE=$(date -u +%Y-%m-%d) \
            -t fermata:ci .
