[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fermata"
version = "0.1.0"
description = "Self-hosted sheet music server"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "fonttools>=4.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["fermata"]
