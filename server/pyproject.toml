[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fermata"
version = "0.1.0"
description = "Self-hosted sheet music server"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
]

# Offline analysis tools under tools/ (e.g. tools/tab_extract) are not part
# of the server runtime and aren't needed to run it - their extra
# dependencies live here instead of in `dependencies` above. Install with
# `pip install -e ".[tools]"` from this directory.
[project.optional-dependencies]
tools = ["fonttools>=4.50"]

[tool.hatch.build.targets.wheel]
packages = ["fermata"]
